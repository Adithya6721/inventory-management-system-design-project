version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "inventory-rs", "--bind_ip_all"]
    container_name: inventory-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - inventory-net

  mongodb-init:
    image: mongo:7.0
    command: ["mongosh", "--host", "mongodb:27017", "--quiet", "--file", "/init-replica.js"]
    volumes:
      - ./scripts/init-replica.js:/init-replica.js:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - inventory-net

  redis:
    image: redis:7.2-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - inventory-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=inventory_db
      - MONGO_URI=mongodb://mongodb:27017/inventory_db?replicaSet=inventory-rs
      - SHARDING_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - inventory-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventory-net

  supplier-simulator:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    container_name: inventory-supplier-simulator
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - BACKEND_API_URL=http://backend:8080
    networks:
      - inventory-net

volumes:
  mongo_data:

networks:
  inventory-net:
    driver: bridge

